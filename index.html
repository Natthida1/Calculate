<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <title>ລະບົບສ້າງຟາຍຄິດໄລ່ຄະແນນຄົບ 8 ພາກຮຽນ (Complete 16 Sheets)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: 'Phetsarath OT', 'Segoe UI', Tahoma, sans-serif; background: #eef2f7; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1100px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1a365d; margin-bottom: 25px; }
    .grid-header { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    .form-group input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    
    /* Tabs สำหรับเลือกเทอม */
    .tabs-nav { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 16px; border: none; background: #e2e8f0; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .tab-btn.active { background: #2563eb; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 12px; text-align: left; }
    th { background: #f1f5f9; font-size: 13px; color: #475569; }
    .btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: 500; }
    .btn-add { background: #10b981; color: #fff; margin-top: 10px; }
    .btn-del { background: #ef4444; color: #fff; }
    .btn-gen { background: #1e40af; color: #fff; font-size: 18px; width: 100%; padding: 15px; margin-top: 30px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; }
    .btn-gen:hover { background: #1d4ed8; }
    .sem-title { font-weight: bold; font-size: 16px; color: #1e293b; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>ລະບົບສ້າງຟາຍຄິດໄລ່ຄະແນນ (Calculate.xlsx - ຄົບ 16 Sheets)</h2>
  
  <div class="grid-header">
    <div class="form-group">
      <label>ພາກວິຊາ (ພາສາລາວ):</label>
      <input type="text" id="deptLao" value="ພາກວິຊາພາສາຍີ່ປຸ່ນ">
    </div>
    <div class="form-group">
      <label>ພາກວິຊາ (ພາສາອັງກິດ):</label>
      <input type="text" id="deptEng" value="Department of Japanese">
    </div>
    <div class="form-group">
      <label>ສົກຮຽນເລີ່ມຕົ້ນ (ເຊັ່ນ 2023-2024):</label>
      <input type="text" id="acadYear" value="2023-2024">
    </div>
  </div>

  <!-- แถบเลือกปีที่ 1 ถึง 4 (8 ภาคเรียน) -->
  <div class="tabs-nav" id="tabsNav"></div>
  <div id="tabsContainer"></div>

  <button type="button" class="btn-gen" onclick="generateCompleteExcel()">
    ສ້າງແລະດາວໂຫຼດຟາຍ Excel (ຄົບ 16 Sheets)
  </button>
</div>

<script>
  // สร้างโครงสร้าง 8 ภาคเรียน
  const semesterDefs = [
    { id: 'sem1', name: 'ປີ 1 ພາກຮຽน 1 (Sem 1)', semNum: 1, pair: 'Sem1-2' },
    { id: 'sem2', name: 'ປີ 1 ພາກຮຽน 2 (Sem 2)', semNum: 2, pair: 'Sem1-2' },
    { id: 'sem3', name: 'ປີ 2 ພາກຮຽน 1 (Sem 3)', semNum: 3, pair: 'Sem3-4 ' },
    { id: 'sem4', name: 'ປີ 2 ພາກຮຽน 2 (Sem 4)', semNum: 4, pair: 'Sem3-4 ' },
    { id: 'sem5', name: 'ປີ 3 ພາກຮຽน 1 (Sem 5)', semNum: 5, pair: 'Sem5-6' },
    { id: 'sem6', name: 'ປີ 3 ພາກຮຽน 2 (Sem 6)', semNum: 6, pair: 'Sem5-6' },
    { id: 'sem7', name: 'ປີ 4 ພາກຮຽน 1 (Sem 7)', semNum: 7, pair: 'Sem7-8' },
    { id: 'sem8', name: 'ປີ 4 ພາກຮຽน 2 (Sem 8)', semNum: 8, pair: 'Sem7-8' }
  ];

  // ข้อมูลตั้งต้นบางส่วน
  const defaultSubjects = {
    sem1: [
      { code: '125 JP 121', nameLao: 'ພາສາຍີ່ປຸ່ນ 1', nameEng: 'Japanese 1', credits: 3 },
      { code: '125 LS 121', nameLao: 'ການຟັງ-ການເວົ້າ 1', nameEng: 'Listening & Speaking 1', credits: 2 },
      { code: '125 PL 111', nameLao: 'ສຽງ ແລະ ຕົວອັກສອນ', nameEng: 'Phonetics & Letters', credits: 1 },
      { code: '125 KJ 111', nameLao: 'ຄັນຈິ 1', nameEng: 'Kanji 1', credits: 1 },
      { code: '125 JG 121', nameLao: 'ໄວຍາກອນຍີ່ປຸ່ນ 1', nameEng: 'Japanese Grammar 1', credits: 2 }
    ],
    sem2: [
      { code: '125 JP 122', nameLao: 'ພາສາຍີ່ປຸ່ນ 2', nameEng: 'Japanese 2', credits: 3 },
      { code: '125 LS 122', nameLao: 'ການເວົ້າ-ການຟັງ 2', nameEng: 'Listening & Speaking 2', credits: 2 }
    ]
  };

  // Render UI Tabs
  const tabsNav = document.getElementById('tabsNav');
  const tabsContainer = document.getElementById('tabsContainer');

  semesterDefs.forEach((sem, idx) => {
    // Tab Button
    const btn = document.createElement('button');
    btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
    btn.textContent = sem.name;
    btn.onclick = () => switchTab(sem.id);
    tabsNav.appendChild(btn);

    // Tab Pane
    const pane = document.createElement('div');
    pane.id = sem.id;
    pane.className = `tab-content ${idx === 0 ? 'active' : ''}`;
    pane.innerHTML = `
      <div class="sem-title">${sem.name}</div>
      <table>
        <thead>
          <tr>
            <th style="width: 140px;">ລະຫັດວິຊາ</th>
            <th>ຊື່ວິຊາ (ພາສາລາວ)</th>
            <th>ຊື່ວິຊາ (ພາສາອັງກິດ)</th>
            <th style="width: 80px;">ໜ່ວຍກິດ</th>
            <th style="width: 50px;">ລຶບ</th>
          </tr>
        </thead>
        <tbody id="tbody_${sem.id}"></tbody>
      </table>
      <button type="button" class="btn btn-add" onclick="addSubjectRow('${sem.id}')">+ ເພີ່ມວິຊາໃນພາກຮຽນນີ້</button>
    `;
    tabsContainer.appendChild(pane);

    // เติมข้อมูลเริ่มต้น
    const initData = defaultSubjects[sem.id] || [{ code: '', nameLao: '', nameEng: '', credits: 2 }];
    initData.forEach(s => addSubjectRow(sem.id, s.code, s.nameLao, s.nameEng, s.credits));
  });

  function switchTab(semId) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', semesterDefs[i].id === semId);
    });
    document.querySelectorAll('.tab-content').forEach(p => {
      p.classList.toggle('active', p.id === semId);
    });
  }

  function addSubjectRow(semId, code='', nameLao='', nameEng='', credits=2) {
    const tbody = document.getElementById(`tbody_${semId}`);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" class="sub-code" value="${code}"></td>
      <td><input type="text" class="sub-lao" value="${nameLao}"></td>
      <td><input type="text" class="sub-eng" value="${nameEng}"></td>
      <td><input type="number" class="sub-credit" value="${credits}"></td>
      <td><button class="btn btn-del" onclick="this.closest('tr').remove()">X</button></td>
    `;
    tbody.appendChild(tr);
  }

  function getColLetter(colIdx) {
    let letter = '';
    while (colIdx > 0) {
      let mod = (colIdx - 1) % 26;
      letter = String.fromCharCode(65 + mod) + letter;
      colIdx = Math.floor((colIdx - mod) / 26);
    }
    return letter;
  }

  async function generateCompleteExcel() {
    const workbook = new ExcelJS.Workbook();

    // ดึงข้อมูลรูปภาพ Logo.jpeg (ถ้ามีในโฟลเดอร์)
    let logoImageId = null;
    try {
      const resp = await fetch('Logo.jpeg');
      if (resp.ok) {
        const blob = await resp.blob();
        const arrayBuf = await blob.arrayBuffer();
        logoImageId = workbook.addImage({
          buffer: arrayBuf,
          extension: 'jpeg',
        });
      }
    } catch(e) {
      console.log('Logo.jpeg not found or CORS blocked, skipping logo.');
    }

    // รวบรวมข้อมูลทุกเทอม
    const allSemestersData = {};
    semesterDefs.forEach(s => {
      const rows = document.querySelectorAll(`#tbody_${s.id} tr`);
      allSemestersData[s.id] = [];
      rows.forEach(r => {
        const code = r.querySelector('.sub-code').value.trim();
        const nameLao = r.querySelector('.sub-lao').value.trim();
        const nameEng = r.querySelector('.sub-eng').value.trim();
        const credits = parseInt(r.querySelector('.sub-credit').value) || 0;
        if (code || nameLao) {
          allSemestersData[s.id].push({ code, nameLao, nameEng, credits });
        }
      });
    });

    // -------------------------------------------------------------
    // 1. LAYER 1: ສ້າງ 4 Sheets Sem (Sem1-2, Sem3-4 , Sem5-6, Sem7-8)
    // -------------------------------------------------------------
    const semPairs = [
      { name: 'Sem1-2', semA: 'sem1', semB: 'sem2', labelA: 'ພາກຮຽນ 1', labelB: 'ພາກຮຽນ 2' },
      { name: 'Sem3-4 ', semA: 'sem3', semB: 'sem4', labelA: 'ພາກຮຽນ 3', labelB: 'ພາກຮຽນ 4' },
      { name: 'Sem5-6', semA: 'sem5', semB: 'sem6', labelA: 'ພາກຮຽນ 5', labelB: 'ພາກຮຽນ 6' },
      { name: 'Sem7-8', semA: 'sem7', semB: 'sem8', labelA: 'ພາກຮຽນ 7', labelB: 'ພາກຮຽນ 8' }
    ];

    const semMetaInfo = {}; // เก็บพิกัดคอลัมน์ของแต่ละเทอม

    semPairs.forEach(pair => {
      const ws = workbook.addWorksheet(pair.name);
      
      // ส่วนหัวข้อมูลพื้นฐาน (แถว 2)
      const baseHeaders = ["ລ/ດ", "ລະຫັດນສ", "ເພດ", "ຊື່ພາສາລາວ", "ນາມສະກຸນພາສາລາວ", "ຊື່ພາສາອັງກິດ", "ນາມສະກຸນພາສາອັງກິດ", "ວ.ດ.ປີເກີດ", "ແຂວງເກີດ", "ຫ້ອງ"];
      baseHeaders.forEach((h, i) => ws.getRow(2).getCell(i + 1).value = h);

      let currentCol = baseHeaders.length + 1;
      semMetaInfo[pair.name] = {};

      [ { id: pair.semA, label: pair.labelA }, { id: pair.semB, label: pair.labelB } ].forEach(subTerm => {
        const subs = allSemestersData[subTerm.id] || [];
        const gpaTerms = [];
        let totalCr = 0;
        semMetaInfo[pair.name][subTerm.id] = { subjects: [] };

        subs.forEach(subj => {
          const scCol = currentCol;
          const ptCol = currentCol + 1;
          const grCol = currentCol + 2;

          ws.getRow(3).getCell(scCol).value = `${subj.nameLao} (${subj.credits})`;
          ws.getRow(4).getCell(scCol).value = "ຄະແນນລວມ";
          ws.getRow(4).getCell(ptCol).value = "ຄ່າລະດັບ";
          ws.getRow(4).getCell(grCol).value = "ລະດັບ";

          semMetaInfo[pair.name][subTerm.id].subjects.push({
            ...subj,
            scoreCol: scCol,
            pointCol: ptCol,
            gradeCol: grCol
          });

          // สูตรค่างวดและเกรด แถว 7 ถึง 37
          for (let r = 7; r <= 37; r++) {
            const scL = getColLetter(scCol);
            ws.getRow(r).getCell(ptCol).value = {
              formula: `IF(${scL}${r}>90,"4.00",IF(${scL}${r}>80,"3.50",IF(${scL}${r}>69,"3.00",IF(${scL}${r}>64,"2.50",IF(${scL}${r}>59,"2.00",IF(${scL}${r}>54,"1.50",IF(${scL}${r}>49,"1.00","0.00")))))))`
            };
            ws.getRow(r).getCell(grCol).value = {
              formula: `IF(${scL}${r}>=91,"A",IF(${scL}${r}>=81,"B+",IF(${scL}${r}>=70,"B",IF(${scL}${r}>=65,"C+",IF(${scL}${r}>=60,"C",IF(${scL}${r}>=55,"D+",IF(${scL}${r}>=50,"D",IF(${scL}${r}>=0,"F"))))))))`
            };
          }

          gpaTerms.push({ col: ptCol, cr: subj.credits });
          totalCr += subj.credits;
          currentCol += 3;
        });

        // คอลัมน์คำนวณ GPA รายเทอม
        const gpaCol = currentCol;
        ws.getRow(3).getCell(gpaCol).value = `GPA (${subTerm.label})`;
        for (let r = 7; r <= 37; r++) {
          if (totalCr > 0) {
            const sumP = gpaTerms.map(t => `${getColLetter(t.col)}${r}*${t.cr}`).join('+');
            ws.getRow(r).getCell(gpaCol).value = { formula: `(${sumP})/${totalCr}` };
          }
        }
        semMetaInfo[pair.name][subTerm.id].gpaCol = gpaCol;
        currentCol += 1;
      });
    });

    // -------------------------------------------------------------
    // 2. LAYER 2: ສ້າງ 4 Sheets CGPA (CGPA2, CGPA4, CGPA6, CGPA8)
    // -------------------------------------------------------------
    const cgpaConfigs = [
      { name: 'CGPA2', gpas: [{ sheet: 'Sem1-2', col: semMetaInfo['Sem1-2']['sem1'].gpaCol, lbl: 'GPA1' }, { sheet: 'Sem1-2', col: semMetaInfo['Sem1-2']['sem2'].gpaCol, lbl: 'GPA2' }] },
      { name: 'CGPA4', gpas: [{ sheet: 'Sem1-2', col: semMetaInfo['Sem1-2']['sem1'].gpaCol, lbl: 'GPA1' }, { sheet: 'Sem1-2', col: semMetaInfo['Sem1-2']['sem2'].gpaCol, lbl: 'GPA2' }, { sheet: 'Sem3-4 ', col: semMetaInfo['Sem3-4 ']['sem3'].gpaCol, lbl: 'GPA3' }, { sheet: 'Sem3-4 ', col: semMetaInfo['Sem3-4 ']['sem4'].gpaCol, lbl: 'GPA4' }] },
      { name: 'CGPA6', gpas: [{ sheet: 'Sem1-2', col: semMetaInfo['Sem1-2']['sem1'].gpaCol, lbl: 'GPA1' }, { sheet: 'Sem1-2', col: semMetaInfo['Sem1-2']['sem2'].gpaCol, lbl: 'GPA2' }, { sheet: 'Sem3-4 ', col: semMetaInfo['Sem3-4 ']['sem3'].gpaCol, lbl: 'GPA3' }, { sheet: 'Sem3-4 ', col: semMetaInfo['Sem3-4 ']['sem4'].gpaCol, lbl: 'GPA4' }, { sheet: 'Sem5-6', col: semMetaInfo['Sem5-6']['sem5'].gpaCol, lbl: 'GPA5' }, { sheet: 'Sem5-6', col: semMetaInfo['Sem5-6']['sem6'].gpaCol, lbl: 'GPA6' }] },
      { name: 'CGPA8', gpas: [{ sheet: 'Sem1-2', col: semMetaInfo['Sem1-2']['sem1'].gpaCol, lbl: 'GPA1' }, { sheet: 'Sem1-2', col: semMetaInfo['Sem1-2']['sem2'].gpaCol, lbl: 'GPA2' }, { sheet: 'Sem3-4 ', col: semMetaInfo['Sem3-4 ']['sem3'].gpaCol, lbl: 'GPA3' }, { sheet: 'Sem3-4 ', col: semMetaInfo['Sem3-4 ']['sem4'].gpaCol, lbl: 'GPA4' }, { sheet: 'Sem5-6', col: semMetaInfo['Sem5-6']['sem5'].gpaCol, lbl: 'GPA5' }, { sheet: 'Sem5-6', col: semMetaInfo['Sem5-6']['sem6'].gpaCol, lbl: 'GPA6' }, { sheet: 'Sem7-8', col: semMetaInfo['Sem7-8']['sem7'].gpaCol, lbl: 'GPA7' }, { sheet: 'Sem7-8', col: semMetaInfo['Sem7-8']['sem8'].gpaCol, lbl: 'GPA8' }] }
    ];

    cgpaConfigs.forEach(cfg => {
      const ws = workbook.addWorksheet(cfg.name);
      ws.getCell('A2').value = "ລ/ດ";
      ws.getCell('B2').value = "ລະຫັດນສ";
      ws.getCell('C2').value = "ເພດ";
      ws.getCell('D2').value = "ຊື່";
      ws.getCell('E2').value = "ນາມສະກຸນ";

      let gpaStartCol = 8; // Column H
      cfg.gpas.forEach((g, i) => {
        ws.getRow(2).getCell(gpaStartCol + i).value = g.lbl;
      });
      const cgpaCol = gpaStartCol + cfg.gpas.length;
      ws.getRow(2).getCell(cgpaCol).value = cfg.name;

      for (let r = 3; r <= 33; r++) {
        const semRow = r + 4;
        ws.getCell(`A${r}`).value = r - 2;
        ws.getCell(`B${r}`).value = { formula: `='Sem1-2'!B${semRow}` };
        ws.getCell(`C${r}`).value = { formula: `='Sem1-2'!C${semRow}` };
        ws.getCell(`D${r}`).value = { formula: `='Sem1-2'!D${semRow}` };
        ws.getCell(`E${r}`).value = { formula: `='Sem1-2'!E${semRow}` };

        const gpaCells = [];
        cfg.gpas.forEach((g, i) => {
          const colL = getColLetter(gpaStartCol + i);
          const refColL = getColLetter(g.col);
          ws.getCell(`${colL}${r}`).value = { formula: `='${g.sheet}'!${refColL}${semRow}` };
          gpaCells.push(`${colL}${r}`);
        });

        // คำนวณ CGPA สะสม
        const cgpaColL = getColLetter(cgpaCol);
        ws.getCell(`${cgpaColL}${r}`).value = { formula: `=(${gpaCells.join('+')})/${gpaCells.length}` };
      }
    });

    // -------------------------------------------------------------
    // 3. LAYER 3: ສ້າງ 8 Sheets Transcript (Lao & Eng ສຳລັບ ປີ 1 - ປີ 4)
    // -------------------------------------------------------------
    const years = [
      { y: 1, laoName: 'Lao_transcript(year1)', engName: 'Eng_transcript(year1)', pair: 'Sem1-2', s1: 'sem1', s2: 'sem2' },
      { y: 2, laoName: 'Lao_transcript(year2) ', engName: 'Eng_transcript(year2)', pair: 'Sem3-4 ', s1: 'sem3', s2: 'sem4' },
      { y: 3, laoName: 'Lao_transcript(year3)', engName: 'Eng_transcript(year3)', pair: 'Sem5-6', s1: 'sem5', s2: 'sem6' },
      { y: 4, laoName: 'Lao_transcript(year4)', engName: 'Eng_transcript(year4)', pair: 'Sem7-8', s1: 'sem7', s2: 'sem8' }
    ];

    years.forEach(yr => {
      // 3.1 Lao Transcript
      const wsLao = workbook.addWorksheet(yr.laoName);
      wsLao.getCell('A9').value = "ໃບຕິດຕາມຜົນການຮຽນ";
      wsLao.getCell('A10').value = "ຊື່ ແລະນາມສະກຸນ";
      wsLao.getCell('F10').value = { formula: `=IF(OR(VLOOKUP($F$12,'Sem1-2'!$B$7:$BS$37,2,FALSE)="ຊາຍ", VLOOKUP($F$12,'Sem1-2'!$B$7:$BS$37,2,FALSE)="ທ້າວ"),"ທ້າວ","ນາງ")&" "&VLOOKUP($F$12,'Sem1-2'!$B$7:$BS$37,3,FALSE)&" "&VLOOKUP($F$12,'Sem1-2'!$B$7:$BS$37,4,FALSE)` };
      wsLao.getCell('A11').value = "ວັນ/ເດືອນ/ປີເກີດ";
      wsLao.getCell('F11').value = { formula: `=VLOOKUP($F$12,'Sem1-2'!$B$7:$BX$37,7,FALSE)` };
      wsLao.getCell('A12').value = "ເລກທະບຽນ";
      wsLao.getCell('F12').value = "125N0622/23"; // ช่องกรอกรหัสนักศึกษาค้นหา

      wsLao.getCell('C14').value = "ລດ";
      wsLao.getCell('D14').value = "ເລກລະຫັດ";
      wsLao.getCell('E14').value = "ຊື່ວິຊາ";
      wsLao.getCell('G14').value = "ຈຳນວນໜ່ວຍກິດ";
      wsLao.getCell('H14').value = "ຄະແນນ";
      wsLao.getCell('I14').value = "ຄ່າລະດັບ";
      wsLao.getCell('J14').value = "ເກຣດ";

      let trRow = 16;
      const subs1 = semMetaInfo[yr.pair][yr.s1].subjects;
      const subs2 = semMetaInfo[yr.pair][yr.s2].subjects;

      // วนวางวิชาเทอม 1 ของปีนั้น
      subs1.forEach((s, idx) => {
        wsLao.getCell(`C${trRow}`).value = idx + 1;
        wsLao.getCell(`D${trRow}`).value = s.code;
        wsLao.getCell(`E${trRow}`).value = s.nameLao;
        wsLao.getCell(`G${trRow}`).value = s.credits;
        wsLao.getCell(`H${trRow}`).value = { formula: `=VLOOKUP($F$12,'${yr.pair}'!$B$7:$ZZ$37,${s.scoreCol - 1},FALSE)` };
        wsLao.getCell(`I${trRow}`).value = { formula: `=IF(H${trRow}>90,"4.00",IF(H${trRow}>80,"3.50",IF(H${trRow}>69,"3.00",IF(H${trRow}>64,"2.50",IF(H${trRow}>59,"2.00",IF(H${trRow}>54,"1.50",IF(H${trRow}>49,"1.00","0.00")))))))` };
        wsLao.getCell(`J${trRow}`).value = { formula: `=IF(H${trRow}>=91,"A",IF(H${trRow}>=81,"B+",IF(H${trRow}>=70,"B",IF(H${trRow}>=65,"C+",IF(H${trRow}>=60,"C",IF(H${trRow}>=55,"D+",IF(H${trRow}>=50,"D",IF(H${trRow}>=0,"F"))))))))` };
        trRow++;
      });

      // วนวางวิชาเทอม 2 ของปีนั้น
      trRow += 2;
      subs2.forEach((s, idx) => {
        wsLao.getCell(`C${trRow}`).value = idx + 1;
        wsLao.getCell(`D${trRow}`).value = s.code;
        wsLao.getCell(`E${trRow}`).value = s.nameLao;
        wsLao.getCell(`G${trRow}`).value = s.credits;
        wsLao.getCell(`H${trRow}`).value = { formula: `=VLOOKUP($F$12,'${yr.pair}'!$B$7:$ZZ$37,${s.scoreCol - 1},FALSE)` };
        wsLao.getCell(`I${trRow}`).value = { formula: `=IF(H${trRow}>90,"4.00",IF(H${trRow}>80,"3.50",IF(H${trRow}>69,"3.00",IF(H${trRow}>64,"2.50",IF(H${trRow}>59,"2.00",IF(H${trRow}>54,"1.50",IF(H${trRow}>49,"1.00","0.00")))))))` };
        wsLao.getCell(`J${trRow}`).value = { formula: `=IF(H${trRow}>=91,"A",IF(H${trRow}>=81,"B+",IF(H${trRow}>=70,"B",IF(H${trRow}>=65,"C+",IF(H${trRow}>=60,"C",IF(H${trRow}>=55,"D+",IF(H${trRow}>=50,"D",IF(H${trRow}>=0,"F"))))))))` };
        trRow++;
      });

      // แปะรูปโลโก้ถ้ามี
      if (logoImageId !== null) {
        wsLao.addImage(logoImageId, {
          tl: { col: 0.5, row: 1 },
          ext: { width: 90, height: 90 }
        });
      }

      // 3.2 Eng Transcript
      const wsEng = workbook.addWorksheet(yr.engName);
      wsEng.getCell('A9').value = "ACADEMIC TRANSCRIPT";
      wsEng.getCell('A10').value = "Full Name";
      wsEng.getCell('F10').value = { formula: `=VLOOKUP($F$12,'Sem1-2'!$B$7:$BX$37,5,FALSE)&" "&VLOOKUP($F$12,'Sem1-2'!$B$7:$BX$37,6,FALSE)` };
      wsEng.getCell('A12').value = "Student ID";
      wsEng.getCell('F12').value = "125N0622/23";

      let engRow = 16;
      subs1.forEach((s, idx) => {
        wsEng.getCell(`C${engRow}`).value = idx + 1;
        wsEng.getCell(`D${engRow}`).value = s.code;
        wsEng.getCell(`E${engRow}`).value = s.nameEng || s.nameLao;
        wsEng.getCell(`G${engRow}`).value = s.credits;
        wsEng.getCell(`H${engRow}`).value = { formula: `='${yr.laoName}'!H${16 + idx}` };
        wsEng.getCell(`I${engRow}`).value = { formula: `='${yr.laoName}'!I${16 + idx}` };
        wsEng.getCell(`J${engRow}`).value = { formula: `='${yr.laoName}'!J${16 + idx}` };
        engRow++;
      });

      if (logoImageId !== null) {
        wsEng.addImage(logoImageId, {
          tl: { col: 0.5, row: 1 },
          ext: { width: 90, height: 90 }
        });
      }
    });

    // ดาวน์โหลดไฟล์ Excel ทันที
    const buffer = await workbook.xlsx.writeBuffer();
    saveAs(new Blob([buffer]), "Calculate.xlsx");
  }
</script>
